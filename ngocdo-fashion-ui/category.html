<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thời Trang Nam - Ngoc Đỗ Fashion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cat-hero { height: 400px; position: relative; display: flex; align-items: center; justify-content: center; color: #fff; background-size: cover; background-position: center; margin-bottom: 60px; overflow: hidden; }
        .cat-hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6)); }
        .cat-hero-content { position: relative; z-index: 1; text-align: center; }
        .cat-hero h1 { font-family: var(--font-heading); font-size: 3.5rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 4px; }
        .cat-hero p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin: 0 auto; }
        
        .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .sort-select { padding: 10px 20px; border-radius: 30px; border: 1px solid var(--border); background: #fff; font-size: 0.88rem; cursor: pointer; outline: none; }
    </style>
</head>
<body>
    <header class="header" id="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">ND</span>
                <div class="logo-text"><strong>NGOC ĐỖ</strong><small>FASHION</small></div>
            </a>
            <nav class="nav" id="nav">
                <a href="index.html" class="nav-link">Trang chủ</a>
                <a href="index.html#new-arrivals" class="nav-link">Hàng mới</a>
                <a href="index.html#categories" class="nav-link">Danh mục</a>
                <a href="index.html#bestsellers" class="nav-link">Bán chạy</a>
            </nav>
            <div class="header-actions">
                <a href="index.html" class="btn btn-primary" style="padding:10px 20px;font-size:.82rem">← Về trang chủ</a>
            </div>
        </div>
    </header>

    <section class="cat-hero" style="background-image: url('images/cat_men.png')">
        <div class="cat-hero-overlay"></div>
        <div class="cat-hero-content">
            <a href="index.html" class="btn btn-sm" style="background:rgba(255,255,255,0.2); backdrop-filter:blur(5px); color:#fff; border:1px solid rgba(255,255,255,0.3); margin-bottom:20px; display:inline-flex; align-items:center; gap:8px">
                <i class="fas fa-arrow-left"></i> Quay lại trang chủ
            </a>
            <h1>Thời Trang Nam</h1>
            <p>Khám phá phong cách mạnh mẽ và tinh tế trong từng thiết kế.</p>
        </div>
    </section>

    <div class="container">
        <div class="filter-bar">
            <div>
                <strong>1</strong> sản phẩm
            </div>
            <div style="display:flex; gap:15px; align-items:center">
                <div style="position:relative">
                    <input type="text" id="catSearch" placeholder="Tìm trong danh mục..." style="padding:10px 20px 10px 40px; border-radius:30px; border:1px solid var(--border); font-size:0.88rem; outline:none">
                    <i class="fas fa-search" style="position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--text-light)"></i>
                </div>
                <span>Sắp xếp:</span>
                <select class="sort-select">
                    <option value="latest">Mới nhất</option>
                    <option value="price_asc">Giá thấp đến cao</option>
                    <option value="price_desc">Giá cao đến thấp</option>
                </select>
            </div>
        </div>

        <div class="product-grid" style="margin-bottom:80px">
            <div class="product-card" data-id="1" data-name="Áo Sơ Mi Linen" data-price="450000">
                <div class="product-img-wrap">
                    <span class="product-badge new">NEW</span>
                    <img src="images/product1.png" alt="Áo Sơ Mi Linen">
                    <div class="product-actions">
                        <button class="pa-btn add-to-cart-btn"><i class="fas fa-shopping-bag"></i></button>
                        <a href="product.html" class="pa-btn"><i class="fas fa-eye"></i></a>
                    </div>
                </div>
                <div class="product-info">
                    <p class="product-cat">Thời Trang Nam</p>
                    <h3 class="product-name"><a href="product.html" style="color:inherit">Áo Sơ Mi Linen Premium</a></h3>
                    <div class="product-price">
                        <span class="current">450.000₫</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-bottom">
            <p>© 2026 Ngoc Đỗ Fashion. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
